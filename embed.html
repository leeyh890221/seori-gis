<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서리 과업 대상지역 GIS 분석</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block;visibility:hidden}iframe.on{visibility:visible}</style>
</head>
<body>
<!-- FieldMappy 삽입용: 상단 로고·헤드라인과 회사정보를 빼고 면적·필지·용수사용량 수치와 작성자 정보만 보여줍니다 -->
<iframe id="f" allow="geolocation" title="서리 과업 대상지역 GIS 분석"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var f = this;
  try { if (!/index\.html/.test(f.contentWindow.location.href)) return; } catch (e) {}
  try {
    var d = f.contentDocument;
    var ob = d.querySelector('.orgbar');
    if (ob) ob.remove();
    var w = d.querySelector('header.band .wrap');
    if (w) {
      Array.prototype.slice.call(w.children).forEach(function (el) {
        if (!el.classList.contains('kpis')) el.remove();
      });
      w.querySelectorAll('.kpi').forEach(function (k) {
        if (/공$/.test(k.querySelector('b').textContent.trim())) k.remove();
      });
      var k0 = w.querySelector('.kpis');
      if (k0) { k0.style.marginTop = '0'; k0.style.paddingTop = '0'; k0.style.borderTop = '0'; }
      w.parentNode.style.paddingTop = '22px';
      w.parentNode.style.paddingBottom = '22px';
    }
    var c = d.querySelector('section.corp');
    if (c) {
      var cw = c.querySelector('.wrap');
      cw.innerHTML = '<p style="margin:0;font-size:14px;line-height:1.7">작성자 <b style="color:#fff">이용현 과장</b>'
        + ' <span style="opacity:.5;margin:0 6px">|</span> 유선 <a href="tel:042-381-0180">042-381-0180</a>'
        + ' <span style="opacity:.5;margin:0 6px">|</span> 휴대폰 <a href="tel:010-8384-0221">010-8384-0221</a>'
        + ' <span style="opacity:.5;margin:0 6px">|</span> <a href="mailto:leeyh890221@gmail.com">leeyh890221@gmail.com</a></p>';
      c.style.paddingTop = '18px';
      c.style.paddingBottom = '18px';
      c.setAttribute('aria-label', '작성자 정보');
    }
  } catch (e) {}
  f.className = 'on';
});
// 항상 최신 GIS 화면을 불러옵니다 (브라우저 캐시 때문에 옛 화면이 보이는 것 방지)
document.getElementById('f').src = 'index.html?v=' + Date.now();
</script>
</body>
</html>
