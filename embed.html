<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서리 과업 대상지역 GIS 분석</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block;visibility:hidden}iframe.on{visibility:visible}</style>
</head>
<body>
<!-- FieldMappy 삽입용: 상단 로고·헤드라인과 회사정보를 빼고 면적·필지·용수사용량 수치와 작성자 정보만 보여줍니다 -->
<iframe id="f" src="index.html" title="서리 과업 대상지역 GIS 분석"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var f = this;
  try {
    var d = f.contentDocument;
    var ob = d.querySelector('.orgbar');
    if (ob) ob.remove();
    var w = d.querySelector('header.band .wrap');
    if (w) {
      Array.prototype.slice.call(w.children).forEach(function (el) {
        if (!el.classList.contains('kpis')) el.remove();
      });
      w.querySelectorAll('.kpi').forEach(function (k) {
        if (/공$/.test(k.querySelector('b').textContent.trim())) k.remove();
      });
      var k0 = w.querySelector('.kpis');
      if (k0) { k0.style.marginTop = '0'; k0.style.paddingTop = '0'; k0.style.borderTop = '0'; }
      w.parentNode.style.paddingTop = '22px';
      w.parentNode.style.paddingBottom = '22px';
    }
    var c = d.querySelector('section.corp');
    if (c) {
      var id = c.querySelector('.corp-id'), b = c.querySelector('.corp-bot');
      if (id) id.remove();
      if (b) b.remove();
      c.querySelectorAll('.corp-dl > div').forEach(function (r) {
        var t = r.querySelector('dt').textContent.trim();
        if (t !== '작성자' && t !== '작성자 연락처') r.remove();
      });
      c.setAttribute('aria-label', '작성자 정보');
    }
  } catch (e) {}
  f.className = 'on';
});
</script>
</body>
</html>
